[package]
name = "jj-waltz-refill-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Donor preparation and reseed request types, orchestration, and source freshening for jj-waltz"

[dependencies]
jj-waltz-native-jj = { version = "=0.8.0", path = "../../native/jj" }
jj-waltz-workspace-state = { version = "=0.8.0", path = "../../workspace/state" }
jj-waltz-transfer-workspace = { version = "=0.8.0", path = "../../transfer/workspace" }
anyhow = "1.0.100"
fs2 = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shlex = "2.0.1"
toml = "1.1.2"
diff-dirs = { package = "diff-dirs-tree-api", version = "=0.3.0", path = "../../../diff-dirs/tree/api" }
diff-dirs-sync = { package = "diff-dirs-transfer-sync", version = "=0.3.0", path = "../../../diff-dirs/transfer/sync" }

[dev-dependencies]
tempfile = "3.19.1"

[features]
payload-parallel = ["jj-waltz-transfer-workspace/payload-parallel"]
