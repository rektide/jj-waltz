[package]
name = "jj-waltz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A Jujutsu workspace switcher inspired by Worktrun"
repository = "https://github.com/ezracerpac/jj-waltz"
homepage = "https://github.com/ezracerpac/jj-waltz"
readme = "../../README.md"
keywords = ["jj", "jujutsu", "cli", "workspace", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jw"
path = "src/main.rs"

[dependencies]
jj-waltz-native-jj = { version = "0.8.0", path = "../../native/jj" }
jj-waltz-workspace-state = { version = "0.8.0", path = "../../workspace/state" }
jj-waltz-workspace-lifecycle = { version = "0.8.0", path = "../../workspace/lifecycle" }
jj-waltz-refill-engine = { version = "0.8.0", path = "../../refill/engine" }
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5.59", features = ["unstable-dynamic"] }
ratatui = "0.30.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shlex = "2.0.1"
fs2 = "0.4.3"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.19.1"

[features]
payload-parallel = ["jj-waltz-refill-engine/payload-parallel"]

[target.'cfg(unix)'.dev-dependencies]
reflink-copy = "0.1.30"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.190"

[dev-dependencies.diff-dirs]
package = "diff-dirs-tree-api"
version = "0.1.0"
path = "../../../diff-dirs/tree/api"

[dev-dependencies.diff-dirs-sync]
package = "diff-dirs-transfer-sync"
version = "0.1.0"
path = "../../../diff-dirs/transfer/sync"
