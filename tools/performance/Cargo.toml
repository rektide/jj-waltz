[package]
name = "jj-waltz-perf"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "jw-perf"
path = "src/main.rs"

[dependencies]
diff-dirs-perf-runner = { path = "../../../diff-dirs/perf/runner" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
