[package]
name = "jj-waltz-workspace-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Workspace add, switch, remove, adopt, and repair workflows, observation, and doctor for jj-waltz"

[dependencies]
jj-waltz-native-jj = { version = "=0.12.0", path = "../../native/jj" }
jj-waltz-workspace-state = { version = "=0.12.0", path = "../state" }
jj-waltz-transfer-workspace = { version = "=0.12.0", path = "../../transfer/workspace" }
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.19.1"

[features]
payload-parallel = ["jj-waltz-transfer-workspace/payload-parallel"]
